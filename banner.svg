<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Arial Black', 'Helvetica Neue', sans-serif">
<title>Makar — synthwave backend banner</title>
<desc>Cyberpunk 90s outrun banner: neon sun, perspective grid, glowing name MAKAR.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#140424"/>
  <stop offset="55%" stop-color="#2c0a4e"/>
  <stop offset="100%" stop-color="#6e1565"/>
</linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#ffe53b"/>
  <stop offset="48%" stop-color="#ff7a3d"/>
  <stop offset="100%" stop-color="#ff2e97"/>
</linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<mask id="sunmask">
  <circle cx="500" cy="138" r="92" fill="#fff"/>
  <rect x="404" y="150" width="192" height="4" fill="#000"/>
  <rect x="404" y="161" width="192" height="5" fill="#000"/>
  <rect x="404" y="174" width="192" height="6" fill="#000"/>
  <rect x="404" y="189" width="192" height="8" fill="#000"/>
  <rect x="404" y="206" width="192" height="11" fill="#000"/>
</mask>
<pattern id="scan" width="6" height="4" patternUnits="userSpaceOnUse">
  <rect width="6" height="1.2" fill="#000" opacity="0.20"/>
</pattern>
</defs>

<rect width="1000" height="340" fill="url(#sky)"/>
<circle cx="500" cy="138" r="92" fill="url(#sun)" mask="url(#sunmask)" filter="url(#glow)"/>
<rect x="0" y="221" width="1000" height="2" fill="#ff2e97" filter="url(#glow)"/>

<g stroke="#05d9e8" stroke-width="1.3" opacity="0.55">
  <line x1="0" y1="340" x2="500" y2="222"/>
  <line x1="100" y1="340" x2="500" y2="222"/>
  <line x1="200" y1="340" x2="500" y2="222"/>
  <line x1="300" y1="340" x2="500" y2="222"/>
  <line x1="400" y1="340" x2="500" y2="222"/>
  <line x1="500" y1="340" x2="500" y2="222"/>
  <line x1="600" y1="340" x2="500" y2="222"/>
  <line x1="700" y1="340" x2="500" y2="222"/>
  <line x1="800" y1="340" x2="500" y2="222"/>
  <line x1="900" y1="340" x2="500" y2="222"/>
  <line x1="1000" y1="340" x2="500" y2="222"/>
  <line x1="0" y1="225" x2="1000" y2="225"/>
  <line x1="0" y1="233" x2="1000" y2="233"/>
  <line x1="0" y1="246" x2="1000" y2="246"/>
  <line x1="0" y1="265" x2="1000" y2="265"/>
  <line x1="0" y1="294" x2="1000" y2="294"/>
  <line x1="0" y1="338" x2="1000" y2="338"/>
</g>

<text x="503" y="161" text-anchor="middle" font-size="74" font-weight="800" letter-spacing="6" fill="#ff2e97" opacity="0.85">MAKAR</text>
<text x="500" y="158" text-anchor="middle" font-size="74" font-weight="800" letter-spacing="6" fill="#37f3ff" filter="url(#glow)">MAKAR</text>

<text x="500" y="200" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="7" fill="#ffd1f0" font-family="'Courier New', monospace">B A C K E N D   D E V E L O P E R</text>

<text x="28" y="40" font-size="13" letter-spacing="2" fill="#05d9e8" font-family="'Courier New', monospace">//mtaipan</text>
<text x="972" y="40" text-anchor="end" font-size="13" letter-spacing="2" fill="#ff2e97" font-family="'Courier New', monospace">SYS://JVM_2025</text>

<text x="500" y="320" text-anchor="middle" font-size="13" letter-spacing="5" fill="#37f3ff" font-family="'Courier New', monospace" filter="url(#glow)">[ JAVA ] [ SPRING ] [ POSTGRES ] [ DOCKER ]</text>

<rect width="1000" height="340" fill="url(#scan)"/>
<rect x="1" y="1" width="998" height="338" fill="none" stroke="#05d9e8" stroke-width="1" opacity="0.3"/>
</svg>
